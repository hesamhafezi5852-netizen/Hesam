              </activity>
            </application>
          </manifest>
          ESIFILE
          mkdir -p 'src/main/java/dev/esi/alertsmoke'
          cat > 'src/main/java/dev/esi/alertsmoke/SmokeActivity.java' <<'ESIFILE'
