name: Build test APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare test project
        run: |
          mkdir -p '.'
          cat > 'build.gradle' <<'ESIFILE'
          plugins { id 'com.android.application' version '8.7.3' }
          android {
              namespace 'dev.esi.alertsmoke'
              compileSdk 35
              defaultConfig { applicationId 'dev.esi.alertsmoke'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1-test' }
          }
          ESIFILE
          mkdir -p '.'
          cat > 'settings.gradle' <<'ESIFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'ESIAlertSmoke'
