          ESIFILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - name: Verify debug APK and record checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          mkdir delivery
          cp "${apks[0]}" delivery/esi-alert-test.apk
          cd delivery
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose esi-alert-test.apk
          sha256sum esi-alert-test.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: esi-alert-test
          path: delivery/
          if-no-files-found: error
